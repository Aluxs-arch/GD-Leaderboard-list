name: Build Geode release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_ARTIFACT_NAME: Leaderboard-List-v1.0.0

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use CMake 3.30 for Geode SDK compatibility
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 3.30.9
      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: ${{ matrix.platform }}
          build-config: RelWithDebInfo
          combine: true
          bindings-ref: 55b05c0bab332a64f2fe1527731ebb109ca45cff
      - name: Surface build diagnostics if compilation fails
        if: failure()
        shell: bash
        run: |
          echo "GEODE_SDK=${GEODE_SDK:-<unset>}"
          cmake --version
          extra=()
          case "${{ matrix.platform }}" in
            Android32)
              ndk=/usr/local/lib/android/sdk/ndk/29.0.14206865
              extra+=("-DCMAKE_TOOLCHAIN_FILE=$ndk/build/cmake/android.toolchain.cmake" -DANDROID_STL=c++_shared -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-23)
              ;;
            Android64)
              ndk=/usr/local/lib/android/sdk/ndk/29.0.14206865
              extra+=("-DCMAKE_TOOLCHAIN_FILE=$ndk/build/cmake/android.toolchain.cmake" -DANDROID_STL=c++_shared -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23)
              ;;
            MacOS)
              extra+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DGEODE_DISABLE_PRECOMPILED_HEADERS=OFF -DCMAKE_AR=/usr/bin/ar -DCMAKE_RANLIB=/usr/bin/ranlib)
              ;;
          esac
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            '-DGEODE_CODEGEN_CMAKE_ARGS=-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja' \
            -G Ninja "${extra[@]}" -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=${{ matrix.platform }} \
            > /tmp/geode-config-diagnostic.log 2>&1 || true
          tail -n 45 /tmp/geode-config-diagnostic.log | while IFS= read -r line; do
            escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
            printf '::error::%s\n' "$escaped"
          done
          if [ -d build ]; then
            cmake --build build --verbose --parallel 2 > /tmp/geode-build-diagnostic.log 2>&1 || true
            tail -n 35 /tmp/geode-build-diagnostic.log | while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              printf '::error::%s\n' "$escaped"
            done
            for log in build/CMakeFiles/CMakeError.log build/CMakeFiles/CMakeOutput.log; do
              if [ -f "$log" ]; then
                tail -n 12 "$log" | while IFS= read -r line; do
                  escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
                  printf '::error::%s\n' "$escaped"
                done
              fi
            done
          else
            echo '::error::Geode action failed before creating the CMake build directory.'
          fi

  package:
    name: Package .geode
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine platform builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: ${{ steps.combine.outputs.build-output }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish v1.0.0 release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download combined mod
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/*.geode \
            --title "Leaderboard List $TAG_NAME" \
            --notes "First Geode release for Android 64-bit. See the repository README for features and data-source notes."
