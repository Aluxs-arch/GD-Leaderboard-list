name: Build Geode release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_ARTIFACT_NAME: Leaderboard-List-v1.0.1

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win64
            os: windows-latest
          - platform: MacOS
            os: macos-latest
          - platform: iOS
            os: macos-latest
          - platform: Android32
            os: ubuntu-latest
          - platform: Android64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.11.2
          target: ${{ matrix.platform }}
          build-config: RelWithDebInfo
          ccache-variant: ""
          combine: true
          bindings-ref: e4efe171003dc084d0dec9ba356d8d2425916f2e
          # The iOS bindings generator omits FMOD includes on SDK 5.11.2.
          # Force-include the SDK header for that target only.
          configure-args: >-
            -DSKIP_BUILDING_CODEGEN=OFF
            ${{ matrix.platform == 'iOS' && format('-DCMAKE_CXX_FLAGS=-include{0}/geode-sdk-clone/loader/include/Geode/fmod/fmod.hpp', github.workspace) || '' }}
      - name: Surface build diagnostics if compilation fails
        if: failure()
        shell: bash
        run: |
          echo "GEODE_SDK=${GEODE_SDK:-<unset>}"
          if [ -f "$GEODE_SDK/VERSION" ]; then echo "::error::Geode SDK version: $(cat "$GEODE_SDK/VERSION")"; fi
          cmake --version | sed 's/^/::error::/'
          # Preserve the build action's CMake cache; reconfiguring with a different
          # toolchain masks the original compiler error on iOS and Android.
          if [ -f build/build.ninja ]; then
            cmake --build build --verbose --parallel 2 > /tmp/geode-build-diagnostic.log 2>&1 || true
            grep -niE 'error:|fatal error|FAILED:|CMake Error|undefined reference|ld: ' /tmp/geode-build-diagnostic.log | tail -n 25 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            tail -n 15 /tmp/geode-build-diagnostic.log | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          else
            echo '::error::No build.ninja generated; initial CMake configure failed.'
            ls -la build 2>/dev/null || true
            if [ -f build/CMakeFiles/CMakeConfigureLog.yaml ]; then
              tail -n 50 build/CMakeFiles/CMakeConfigureLog.yaml | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            fi
          fi
          mkdir -p geode-diagnostics
          cp /tmp/geode-config-diagnostic.log /tmp/geode-build-diagnostic.log geode-diagnostics/ 2>/dev/null || true
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geode-diagnostics-${{ matrix.platform }}
          path: geode-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package .geode
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Combine platform builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main
      - name: Verify release package
        run: python3 scripts/verify_package.py '${{ steps.combine.outputs.build-output }}' mod.json
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: ${{ steps.combine.outputs.build-output }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download combined mod
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/*.geode \
            --title "Leaderboard List $TAG_NAME" \
            --notes "Geode mod for Geometry Dash 2.2081 on Windows, macOS, iOS and Android. See the repository README for features and data-source notes."
