name: Build Geode release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_ARTIFACT_NAME: Leaderboard-List-v1.0.0

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win64
            os: windows-latest
          - platform: MacOS
            os: macos-latest
          - platform: Android32
            os: ubuntu-latest
          - platform: Android64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.platform }}
          combine: true

  package:
    name: Package .geode
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine platform builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: ${{ steps.combine.outputs.build-output }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish v1.0.0 release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download combined mod
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/*.geode \
            --title "Leaderboard List $TAG_NAME" \
            --notes "First combined Geode release for Windows, macOS, Android 32-bit, and Android 64-bit. See the repository README for features and data-source notes."
