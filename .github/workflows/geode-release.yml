name: Build Geode release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_ARTIFACT_NAME: Leaderboard-List-v1.0.1

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win64
            os: windows-latest
          - platform: MacOS
            os: macos-latest
          - platform: iOS
            os: macos-latest
          - platform: Android32
            os: ubuntu-latest
          - platform: Android64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.11.2
          target: ${{ matrix.platform }}
          build-config: RelWithDebInfo
          ccache-variant: ""
          combine: true
          bindings-ref: e4efe171003dc084d0dec9ba356d8d2425916f2e
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF
      - name: Surface build diagnostics if compilation fails
        if: failure()
        shell: bash
        run: |
          echo "GEODE_SDK=${GEODE_SDK:-<unset>}"
          if [ -f "$GEODE_SDK/VERSION" ]; then echo "::error::Geode SDK version: $(cat "$GEODE_SDK/VERSION")"; fi
          cmake --version | sed 's/^/::error::/'
          configure_status=0
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            '-DGEODE_CODEGEN_CMAKE_ARGS=-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja' \
            -G Ninja -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=${{ matrix.platform }} \
            > /tmp/geode-config-diagnostic.log 2>&1 || configure_status=$?
          echo "::error::Diagnostic CMake configure exit code: $configure_status"
          if [ "$configure_status" -ne 0 ]; then
            tail -n 70 /tmp/geode-config-diagnostic.log | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          { grep -niE -A4 -B3 'CMake (Error|Warning)|Unable to detect platform|error:|Error:|fatal|failed|No such file|not found|undefined|Could not|cannot' /tmp/geode-config-diagnostic.log || true; } | tail -n 60 | while IFS= read -r line; do
            escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
            printf '::error::%s\n' "$escaped"
          done
          if [ -f build/CMakeCache.txt ]; then
            while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done < <(grep -E '^(ANDROID|CMAKE_ANDROID_ARCH_ABI|GEODE_TARGET_PLATFORM):' build/CMakeCache.txt || true)
          fi
          if [ -f build/build.ninja ]; then
            grep -E '^(CMAKE_CXX_COMPILER|CMAKE_CXX_FLAGS|GEODE_DISABLE_FMT_CONSTEVAL):' build/CMakeCache.txt | sed 's/^/::error::/' || true
            build_status=0
            cmake --build build --verbose --parallel 2 > /tmp/geode-build-diagnostic.log 2>&1 || build_status=$?
            echo "::error::Diagnostic CMake build exit code: $build_status"
            diagnostics=$(grep -niE 'error:|fatal error|FAILED:|LNK[0-9]+|FMT_COMPILE|return FMT_COMPILE_STRING' /tmp/geode-build-diagnostic.log | tail -n 20 || true)
            if [ -n "$diagnostics" ]; then
              escaped=$(printf '%s' "$diagnostics" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
              printf '::error title=Compiler diagnostics::%s\n' "$escaped"
            else
              tail -n 8 /tmp/geode-build-diagnostic.log | while IFS= read -r line; do
                escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
                printf '::error::%s\n' "$escaped"
              done
            fi
          else
            echo '::error::No build.ninja was generated by the diagnostic configure.'
            tail -n 35 /tmp/geode-config-diagnostic.log | while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              printf '::error::%s\n' "$escaped"
            done
          fi
          mkdir -p geode-diagnostics
          cp /tmp/geode-config-diagnostic.log /tmp/geode-build-diagnostic.log geode-diagnostics/ 2>/dev/null || true
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geode-diagnostics-${{ matrix.platform }}
          path: geode-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package .geode
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Combine platform builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main
      - name: Verify release package
        run: python3 scripts/verify_package.py '${{ steps.combine.outputs.build-output }}' mod.json
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: ${{ steps.combine.outputs.build-output }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download combined mod
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/*.geode \
            --title "Leaderboard List $TAG_NAME" \
            --notes "Geode mod for Geometry Dash 2.2081 on Windows, macOS, iOS and Android. See the repository README for features and data-source notes."
