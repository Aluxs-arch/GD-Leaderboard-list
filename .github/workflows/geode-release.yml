name: Build Geode release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_ARTIFACT_NAME: Leaderboard-List-v1.0.0

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 4.0.0
          target: ${{ matrix.platform }}
          build-config: RelWithDebInfo
          ccache-variant: ""
          combine: true
          bindings-ref: 23c39fcda5dc660d8e92f3fb14f29b0a58a15f98
          configure-args: -DCMAKE_C_COMPILER=/usr/local/lib/android/sdk/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/clang -DCMAKE_CXX_COMPILER=/usr/local/lib/android/sdk/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++
      - name: Surface build diagnostics if compilation fails
        if: failure()
        shell: bash
        run: |
          echo "GEODE_SDK=${GEODE_SDK:-<unset>}"
          if [ -f "$GEODE_SDK/VERSION" ]; then echo "::error::Geode SDK version: $(cat "$GEODE_SDK/VERSION")"; fi
          cmake --version | sed 's/^/::error::/'
          ndk=/usr/local/lib/android/sdk/ndk/29.0.14206865
          configure_status=0
          ndk_clang="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          ndk_clangxx="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER="$ndk_clang" -DCMAKE_CXX_COMPILER="$ndk_clangxx" \
            "-DGEODE_CODEGEN_CMAKE_ARGS=-DCMAKE_C_COMPILER=$ndk_clang;-DCMAKE_CXX_COMPILER=$ndk_clangxx;-G Ninja" \
            -G Ninja "-DCMAKE_TOOLCHAIN_FILE=$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_STL=c++_shared -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 \
            -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=Android64 \
            > /tmp/geode-config-diagnostic.log 2>&1 || configure_status=$?
          echo "::error::Diagnostic CMake configure exit code: $configure_status"
          { grep -niE -A4 -B3 'CMake (Error|Warning)|Unable to detect platform|error:|Error:|fatal|failed|No such file|not found|undefined|Could not|cannot' /tmp/geode-config-diagnostic.log || true; } | tail -n 60 | while IFS= read -r line; do
            escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
            printf '::error::%s\n' "$escaped"
          done
          if [ -f build/CMakeCache.txt ]; then
            while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done < <(grep -E '^(ANDROID|CMAKE_ANDROID_ARCH_ABI|GEODE_TARGET_PLATFORM):' build/CMakeCache.txt || true)
          fi
          if [ -f build/build.ninja ]; then
            grep -E '^(CMAKE_CXX_COMPILER|CMAKE_CXX_FLAGS|GEODE_DISABLE_FMT_CONSTEVAL):' build/CMakeCache.txt | sed 's/^/::error::/' || true
            "$GITHUB_WORKSPACE/ninja/ninja" -C build -t commands 2>/dev/null | grep -E 'fmt.*os.cc|unity_7_cxx.cxx.o' | head -n 1 | sed 's/^/::error::/' || true
            build_status=0
            cmake --build build --verbose --parallel 2 > /tmp/geode-build-diagnostic.log 2>&1 || build_status=$?
            echo "::error::Diagnostic CMake build exit code: $build_status"
            tail -n 35 /tmp/geode-build-diagnostic.log | while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              printf '::error::%s\n' "$escaped"
            done
          else
            echo '::error::No build.ninja was generated by the diagnostic configure.'
            tail -n 35 /tmp/geode-config-diagnostic.log | while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              printf '::error::%s\n' "$escaped"
            done
          fi
          mkdir -p geode-diagnostics
          cp /tmp/geode-config-diagnostic.log /tmp/geode-build-diagnostic.log geode-diagnostics/ 2>/dev/null || true
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geode-diagnostics-${{ matrix.platform }}
          path: geode-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package .geode
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine platform builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: ${{ steps.combine.outputs.build-output }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish v1.0.0 release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download combined mod
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/*.geode \
            --title "Leaderboard List $TAG_NAME" \
            --notes "First Geode release for Android 64-bit. See the repository README for features and data-source notes."
